name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore .\SennheiserTray.Tests\SennheiserTray.Tests.csproj --locked-mode
      - name: Build application
        run: dotnet build .\SennheiserTray.csproj --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test .\SennheiserTray.Tests\SennheiserTray.Tests.csproj --configuration Release --no-restore
